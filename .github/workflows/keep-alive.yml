name: Supabase Keep Alive

on:
  schedule:
    # 3일마다 UTC 00:00 (KST 09:00)에 실행
    - cron: "0 0 */3 * *"
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query one row to keep Supabase project active
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL 또는 SUPABASE_ANON_KEY 시크릿이 설정되어 있지 않습니다." >&2
            exit 1
          fi

          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/saved_places?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${http_status}"
          cat /tmp/response.json

          if [ "$http_status" -ge 400 ]; then
            echo "Supabase 요청이 실패했습니다 (status ${http_status})." >&2
            exit 1
          fi
